name: Reusable - Notify release base images

# =========================================================================
# Reusable workflow. Invoked by a caller via
#   uses: ./.github/workflows/notify-release-images-template.yml
#   (or cross-repo:)
#   uses: welbsterhansi/lab-utils-notify/.github/workflows/notify-release-images-template.yml@main
#
# Self-contained: all bash (parse, catalog, diff) lives inline in the
# run: steps below. No external scripts, no scripts/ directory.
#
# REQUIRED configuration on the repo (or org, inherited):
#   - secrets.NOTIFY_APP_ID           GitHub App numeric app id
#   - secrets.NOTIFY_APP_PRIVATE_KEY  GitHub App private key (PEM contents)
#
# GitHub App permissions:
#   - Contents:  Read
#   - Issues:    Read & write
#   - Members:   Read      (required for team-mention notifications)
# =========================================================================

on:
  workflow_call:
    inputs:
      teams:
        description: "Recipient mentions, one per line. Supports @user for lab tests and @ORG/team for production."
        required: true
        type: string
      issue_label:
        description: "Label applied to the created Issue"
        required: false
        type: string
        default: "release-notification"
      tag:
        description: "Explicit tag override (manual test only)"
        required: false
        type: string
        default: ""
    secrets:
      NOTIFY_APP_ID:
        description: "GitHub App numeric App ID."
        required: true
      NOTIFY_APP_PRIVATE_KEY:
        description: "GitHub App private key (PEM contents). See README section 2."
        required: true

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NOTIFY_APP_ID }}
          private-key: ${{ secrets.NOTIFY_APP_PRIVATE_KEY }}

      - name: Resolve release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag from event, input, or latest release." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._+-]+$ ]]; then
            echo "Invalid tag format: $TAG" >&2
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"

      - name: Build catalog + diff
        shell: bash
        run: |
          set -euo pipefail

          # ---- Helpers (inline; no external scripts) ----
          extract_last_from() {
            printf '%s\n' "$1" \
              | grep -E '^[[:space:]]*FROM[[:space:]]+' \
              | tail -n1 \
              | sed -E 's/^[[:space:]]*FROM[[:space:]]+//; s/[[:space:]]+AS[[:space:]]+.*$//I; s/[[:space:]]+$//'
          }
          parse_ref() {
            local raw="$1" image tag digest="-"
            if [[ "$raw" == *"@"* ]]; then
              digest="${raw##*@}"
              raw="${raw%@*}"
            fi
            local last="${raw##*/}"
            if [[ "$last" == *":"* ]]; then
              tag="${raw##*:}"
              image="${raw%:*}"
            else
              tag="latest"
              image="$raw"
            fi
            printf '%s\t%s\t%s\n' "$image" "$tag" "$digest"
          }
          list_dockerfiles() {
            find . -type f -name 'Dockerfile*' -not -path './.git/*' | sort
          }

          # ---- Resolve previous tag for diff ----
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            PREV_TAG="$(git tag --sort=-creatordate | awk -v cur="$TAG" '$0 != cur' | head -n1 || true)"
          else
            PREV_TAG="$(git tag --sort=-creatordate | head -n1 || true)"
          fi
          echo "PREV_TAG=${PREV_TAG:-<none>}"

          # ---- Compose the markdown body ----
          {
            echo "## Catalog of base images (release \`${TAG}\`)"
            echo
            echo "| Stack | Image | Tag | Digest |"
            echo "|---|---|---|---|"
            list_dockerfiles | while read -r file; do
              stack="$(dirname "$file" | sed 's#^\./##')"
              raw="$(extract_last_from "$(cat "$file")")"
              if [ -z "$raw" ]; then continue; fi
              IFS=$'\t' read -r image tag digest < <(parse_ref "$raw")
              echo "| \`$stack\` | \`$image\` | \`$tag\` | \`$digest\` |"
            done
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since \`${PREV_TAG}\` (for release \`${TAG}\`)"
              echo
              echo "| Stack | Previous tag | Current tag | Changed? |"
              echo "|---|---|---|---|"
              list_dockerfiles | while read -r file; do
                stack="$(dirname "$file" | sed 's#^\./##')"
                relpath="${file#./}"
                curr_raw="$(extract_last_from "$(cat "$file")")"
                prev_content="$(git show "$PREV_TAG:$relpath" 2>/dev/null || true)"
                if [ -z "$prev_content" ]; then
                  echo "| \`$stack\` | _(new)_ | \`$curr_raw\` | NEW |"
                  continue
                fi
                prev_raw="$(extract_last_from "$prev_content")"
                IFS=$'\t' read -r _ curr_tag _ < <(parse_ref "$curr_raw")
                IFS=$'\t' read -r _ prev_tag _ < <(parse_ref "$prev_raw")
                if [ "$prev_raw" = "$curr_raw" ]; then
                  verdict="unchanged"
                else
                  verdict="**YES**"
                fi
                echo "| \`$stack\` | \`$prev_tag\` | \`$curr_tag\` | $verdict |"
              done
            else
              echo "_First release of the repository: no previous tag to compare against._"
            fi
          } > release-catalog.md

          cat release-catalog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create announcement Issue
        uses: actions/github-script@v7
        env:
          TEAMS: ${{ inputs.teams }}
          ISSUE_LABEL: ${{ inputs.issue_label }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;

            // Resolve release URL: event payload -> API lookup -> tag URL fallback
            let releaseUrl = context.payload.release?.html_url;
            if (!releaseUrl) {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner, repo: context.repo.repo, tag
                });
                releaseUrl = data.html_url;
              } catch (e) {
                releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
              }
            }

            const catalog = fs.readFileSync('release-catalog.md', 'utf8');

            // Accept @user for lab tests and @ORG/team for production.
            const teams = (process.env.TEAMS || '')
              .split('\n').map(s => s.trim())
              .filter(s => s.startsWith('@'));
            if (teams.length === 0) {
              core.setFailed('`teams` input has no valid mentions. Use @user or @ORG/team.');
              return;
            }

            // Human-readable UTC timestamp: YYYY-MM-DD HH:MM UTC
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const ts =
              `${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())}` +
              ` ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())} UTC`;

            const body = [
              teams.join(' '),
              '',
              `**New release published in \`${context.repo.owner}/${context.repo.repo}\`: \`${tag}\`**`,
              '',
              `Published at: **${ts}**`,
              `Release notes: ${releaseUrl}`,
              '',
              '> This automated notification lists every base container image shipped in this release.',
              '> The **Catalog** table shows each stack with its image reference, tag, and pinned digest.',
              '> The **Changes since** table highlights what moved compared to the previous release --',
              '> use it to decide whether your service needs to be rebuilt.',
              '',
              catalog,
              '',
              '---',
              '_Generated by reusable workflow `notify-release-images-template`._',
              '_To stop receiving these notifications, adjust https://github.com/settings/notifications or leave the team._'
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: process.env.ISSUE_LABEL
              });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: process.env.ISSUE_LABEL, color: '0e8a16',
                description: 'Automated release announcement'
              });
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Release ${tag} - base images available`,
              body, labels: [process.env.ISSUE_LABEL]
            });
            core.notice(`Issue created: ${issue.data.html_url}`);
            core.notice(`Recipients mentioned: ${teams.length}`);
