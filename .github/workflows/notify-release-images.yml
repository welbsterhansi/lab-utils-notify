name: Notify release base images

# --------------------------------------------------------------------------
# Caller thin. Todo o comportamento vive em
# .github/workflows/notify-release-images-template.yml.
#
# Este arquivo controla APENAS:
#   1. Quando disparar (release.published + workflow_dispatch)
#   2. Quem notificar (input `teams` abaixo)
#
# Para adicionar/remover destinatarios: editar o bloco `teams:` inline.
# Para mudar comportamento (label, corpo da issue, etc): editar o template.
# --------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag simulada para teste manual"
        required: false
        default: "v0.0.0-test"

jobs:
  call:
    uses: ./.github/workflows/notify-release-images-template.yml
    with:
      # Um por linha. Formato @user OU @ORG/team.
      teams: |
        @welbsterhansi
        @welbsterhansi/container-utils-consumers
        @welbsterhansi/dev-team-pagamentos
        @welbsterhansi/dev-team-cartoes
      tag: ${{ github.event.inputs.tag || '' }}
