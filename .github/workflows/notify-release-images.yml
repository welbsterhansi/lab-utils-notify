name: Notify release base images

# ---------------------------------------------------------------------------
# Thin caller. All behavior lives in the reusable template
# .github/workflows/notify-release-images-template.yml.
#
# EDIT ONLY THESE TWO THINGS when copying to a client repo:
#   1. `workflows:` -- name of the client's release-creating workflow
#   2. `teams:`     -- recipient teams (@ORG/team format only)
#
# The template requires:
#   - vars.NOTIFY_APP_CLIENT_ID       (repo or org)
#   - secrets.NOTIFY_APP_PRIVATE_KEY  (repo or org)
# See README section 2 for GitHub App setup.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["Release"]         # <-- rename to upstream release workflow
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to simulate (manual test only)"
        required: false
        default: "v0.0.0-test"

permissions:
  contents: read
  issues: write

jobs:
  call:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-release-images-template.yml
    with:
      # One per line. Only @ORG/team format is accepted. Bare @user is rejected.
      teams: |
        @welbsterhansi/container-utils-consumers
        @welbsterhansi/dev-team-pagamentos
        @welbsterhansi/dev-team-cartoes
      tag: ${{ github.event.inputs.tag || '' }}
    secrets: inherit
